<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>국내숙박 상시 · 프로모션 트랙 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#F2F4F8;--surface:#fff;--ink:#0F1B2D;--sub:#5B6B84;--line:#E3E8F0;--pos:#0B8F5C;--neg:#CE3D5B;
--A:#1E56D6;--Abg:#EDF2FE;--Adk:#0E2140;--B:#C77A15;--Bbg:#FDF4E3;--Bdk:#3A2A0C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:22px 16px 70px}
.wrap{max-width:1220px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.top{margin-bottom:14px}
.top .sub0{font-size:12.5px;color:var(--sub);margin-top:3px}
/* TRACK SWITCH */
.switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 6px}
.tk{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;cursor:pointer;text-align:left;transition:.15s}
.tk .lb{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--sub)}
.tk .nm{font-size:19px;font-weight:800;margin:3px 0 4px}
.tk .ds{font-size:12px;color:var(--sub);line-height:1.55}
.tk .cnt{font-size:12px;font-weight:800;margin-top:7px;display:inline-block;padding:3px 10px;border-radius:99px;background:#EEF1F6;color:var(--sub)}
.tk.on.a{border-color:var(--A);background:var(--Abg)}
.tk.on.a .nm,.tk.on.a .lb{color:var(--A)}
.tk.on.a .cnt{background:var(--A);color:#fff}
.tk.on.b{border-color:var(--B);background:var(--Bbg)}
.tk.on.b .nm,.tk.on.b .lb{color:var(--B)}
.tk.on.b .cnt{background:var(--B);color:#fff}
.banner{border-radius:12px;padding:11px 16px;font-size:12.5px;font-weight:700;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.a{background:var(--Abg);color:var(--A);border-left:5px solid var(--A)}
.banner.b{background:var(--Bbg);color:var(--B);border-left:5px solid var(--B)}
.banner span{font-weight:600;color:var(--sub)}
.msel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.mb{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px;cursor:pointer;color:var(--sub)}
.mb.on{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10px;font-weight:700;color:var(--sub)}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.kpi .v small{font-size:11.5px;color:var(--sub);font-weight:700}
.kpi .d{font-size:10.5px;font-weight:800;margin-top:2px}
.kpi.hi{color:#fff}.kpi.hi .l{color:rgba(255,255,255,.65)}.kpi.hi .v small{color:rgba(255,255,255,.65)}
.up{color:var(--pos)}.dn{color:var(--neg)}.fl{color:var(--sub)}
section{margin-bottom:24px}
h2{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--sub);margin:3px 0 12px;max-width:950px}
.sub b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.chart{position:relative;height:265px}
.rank{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.rk.r1{border-width:2px}
.rk .who{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.rk .who span.s{font-size:10.5px;color:var(--sub);font-weight:600}
.rk .hero{margin:10px 0 8px;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.rk .hero .lb{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.06em}
.rk .hero .vv{font-size:26px;font-weight:800;letter-spacing:-.03em}
.rk .hero .dd{font-size:10.5px;font-weight:800}
.rk .m{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.rk .m b{font-weight:800}
.snbar{display:flex;height:15px;border-radius:5px;overflow:hidden;margin-top:8px;font-size:9.5px;font-weight:800;color:#fff}
.snbar .b2{background:#E0863A;display:flex;align-items:center;justify-content:center}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.04em;padding:8px 7px;border-bottom:2px solid var(--ink);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:hover td{background:#F6F8FC}
tr.sel td{background:#F0F4FB}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px;cursor:pointer;color:var(--sub)}
.tab.on{color:#fff}
.callout{border-left:4px solid var(--A);background:var(--Abg);border-radius:0 11px 11px 0;padding:13px 15px;font-size:12.8px;margin-top:12px}
.callout.warn{border-color:var(--neg);background:#FDF0F3}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ac{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;border-top:3px solid var(--A)}
.ac h3{font-size:13.5px;font-weight:800;margin-bottom:7px}
.ac p{font-size:12px;color:var(--sub);line-height:1.7}
.ac p b{color:var(--ink)}
@media(max-width:1000px){.act{grid-template-columns:1fr}}
.foot{font-size:11px;color:var(--sub);border-top:1px solid var(--line);padding-top:13px;line-height:1.75;margin-top:10px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.rank{grid-template-columns:1fr 1fr}.switch{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
